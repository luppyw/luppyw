<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title description">
  <title id="title">Wang Zhihao terminal profile</title>
  <desc id="description">A minimal terminal window introducing Wang Zhihao and his work in frontend systems, agent tooling, and interface architecture.</desc>

  <style>
    .frame { fill: #0a0e0c; stroke: #26332c; }
    .rule { stroke: #26332c; }
    .primary { fill: #e6ede9; }
    .muted { fill: #8b9a92; }
    .accent { fill: #6df58c; }
    .mono {
      font-family: "CommitMono", "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
    }
    .cursor { animation: blink 1.4s steps(1, end) infinite; }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <rect class="frame" x="1" y="1" width="898" height="298" rx="8" />

  <circle class="accent" cx="30" cy="28" r="5" />
  <text class="mono muted" x="48" y="35" font-size="20">luppyw@github:~</text>
  <text class="mono accent" x="688" y="35" font-size="18">STATUS: BUILDING</text>
  <path class="rule" d="M1 55.5H899" />

  <text class="mono accent" x="30" y="98" font-size="22">$ whoami</text>
  <text class="mono primary" x="30" y="158" font-size="52">WANG ZHIHAO</text>
  <text class="mono muted" x="32" y="198" font-size="23">frontend systems / agent tooling / UI architecture</text>

  <text class="mono accent" x="30" y="252" font-size="22">$ build --observable --human-readable</text>
  <rect class="accent cursor" x="526" y="232" width="13" height="24" rx="1" />
</svg>
